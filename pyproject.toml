[project]
name = "bi"
version = "0.1.0"
description = "DTI6287: Business Intelligence Technologies & Big Data Analytics"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyspark>=3.5.0",
    "pandas>=2.2.0",
    "pyarrow>=18.0.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
    "scikit-learn>=1.5.0",
    "jupyter>=1.1.0",
    "ipykernel>=6.29.0",
    "python-dotenv>=1.0.0",
    "plotly>=5.24.0",
    "kaleido>=1.3.0",
    "pillow>=12.2.0",
    "transformers>=5.9.0",
    "torch>=2.12.0",
    "sentencepiece>=0.2.1",
    "protobuf>=7.35.0",
]

[dependency-groups]
dev = ["ruff>=0.8.0"]

[tool.uv]
package = true

[tool.setuptools.packages.find]
where = ["src"]
